<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fire Baby · 진짜를 찾아라</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #171724; color: #fff5e8; font-family: system-ui, sans-serif; }
  main { max-width: 1120px; margin: auto; padding: 24px; }
  header { display: flex; justify-content: space-between; gap: 16px; align-items: center; }
  h1 { margin: 4px 0 10px; font-size: clamp(26px, 3.6vw, 38px); }
  p { line-height: 1.6; }
  .eyebrow { color: #ffbc83; font-size: 14px; margin: 0; }
  button, select { font: inherit; min-height: 48px; border-radius: 14px; padding: 10px 18px; }
  button { color: #fff5e8; background: #343044; border: 1px solid #75637b; cursor: pointer; touch-action: manipulation; }
  button:focus-visible, select:focus-visible { outline: 3px solid #ffe3a1; outline-offset: 4px; }
  button:disabled { cursor: default; opacity: .65; }
  .primary { background: #ffc08a; border-color: #ffc08a; color: #392319; font-weight: 750; }
  select { background: #292536; border: 1px solid #75637b; color: inherit; max-width: 100%; }
  label { display: grid; gap: 6px; font-size: 14px; }
  .hint { background: #302638; border: 1px solid #67506c; border-radius: 18px; padding: 15px 20px; margin: 16px 0; }
  .hint p { margin: 0; }
  #clue-text { font-size: 22px; font-weight: 700; color: #ffdaa6; }
  .arena { border: 1px solid #594958; border-radius: 24px; overflow: hidden; background: radial-gradient(ellipse at 50% 110%, #744332, #312536 60%, #211e30); }
  #teacher { text-align: center; padding: 10px 20px 22px; }
  #teacher .sprite { width: min(280px, 38vh); margin: auto; }
  #teacher p { margin: 0 0 14px; }
  #choices { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; padding: 24px 16px; }
  #choices[hidden], #teacher[hidden] { display: none; }
  .candidate { min-width: 0; padding: 6px 0 16px; background: #ffffff06; border: 2px solid #ffffff20; border-radius: 20px; }
  .candidate .number { display: inline-block; padding: 7px 18px; background: #211c30; border-radius: 20px; font-weight: 700; }
  .candidate.dismissed { opacity: .28; }
  .candidate.correct { border-color: #ffce81; background: #ffbb7020; opacity: 1; }
  .sprite { position: relative; width: 100%; aspect-ratio: 1; pointer-events: none; }
  .pose, .blink { position: absolute; inset: 0; width: 100%; height: 100%; background-repeat: no-repeat; }
  .pose { background-size: 500% 100%; }
  .blink { object-fit: contain; opacity: 0; mask-image: radial-gradient(ellipse 2.8% 2.2% at 74% 34%, black 65%, transparent 100%); }
  .sprite.walking .pose { inset: 18% auto auto 8.5%; width: 83%; height: auto; aspect-ratio: 800 / 620; background-size: 300% 100%; }
  .controls { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin: 18px 0; }
  #status { text-align: center; min-height: 32px; margin: 16px 0 0; font-size: 20px; font-weight: 650; }
  footer { color: #c1b3c5; text-align: center; font-size: 14px; }
  @media (max-width: 700px) { main { padding: 16px; } header { align-items: start; flex-wrap: wrap; } #choices { gap: 6px; padding: 18px 6px; } #clue-text { font-size: 19px; } }
  @media (orientation: landscape) and (max-height: 850px) { main { padding-top: 16px; } .hint { margin: 10px 0; } #choices { padding-top: 10px; padding-bottom: 12px; } .candidate .sprite { max-width: 270px; margin: auto; } }
</style>
<main>
  <header>
    <div><p class="eyebrow">FIRE BABY · 분신 놀이 미리보기</p><h1>진짜 나를 찾아봐!</h1></div>
    <label>관찰 난이도<select id="difficulty"><option value="easy">처음에는 · 행동 하나</option><option value="sequence">익숙해지면 · 깜빡임 + 행동</option></select></label>
  </header>
  <section class="hint" aria-label="진짜 드래곤의 단서"><p>우리만 아는 약속</p><p id="clue-text"></p></section>
  <section class="arena" aria-label="드래곤 관찰 놀이">
    <div id="teacher"><div class="sprite"><span class="pose"></span><img class="blink" alt=""></div><p>이 행동을 기억해 줘. 똑같이 하는 내가 진짜야!</p><button id="start" class="primary">기억했어 · 찾기 시작</button></div>
    <div id="choices" hidden></div>
  </section>
  <p id="status" role="status" aria-live="polite"></p>
  <div class="controls"><button id="replay" hidden>단서 다시 보기</button><button id="again">새로 놀기</button></div>
  <footer>시간 제한은 없어. 행동은 천천히 반복돼. 분신을 골라도 계속 찾을 수 있어.</footer>
</main>
<script>
  const root = '../../public/assets/dragons/baby/';
  const asset = name => new URL(root + name + '.webp', location.href).href;
  const sit = asset('fire-sit-sequence');
  const walk = asset('fire-walk-bde');
  const blink = asset('fire-blink');
  const choices = document.querySelector('#choices');
  const teacher = document.querySelector('#teacher');
  const status = document.querySelector('#status');
  const replay = document.querySelector('#replay');
  const difficulty = document.querySelector('#difficulty');
  let phase = 'clue';
  let started = performance.now();
  let round = [];
  let dismissed = new Set();
  let won = false;

  function prepareSprite(sprite) {
    sprite.querySelector('.blink').src = blink;
  }

  function paint(sprite, pattern, time) {
    const t = time % 7200;
    let frame = 0;
    // A shared rhythm lets children compare all three dragons at once.
    if (pattern.action === 'sit' && t >= 2200 && t < 5200) {
      frame = t < 3400 ? Math.min(4, Math.floor((t - 2200) / 300) + 1)
        : t < 4000 ? 4 : Math.max(0, 4 - Math.floor((t - 4000) / 300));
    }
    const walking = pattern.action === 'walk' && t >= 2200 && t < 5200;
    sprite.classList.toggle('walking', walking);
    const pose = sprite.querySelector('.pose');
    pose.style.backgroundImage = `url("${walking ? walk : sit}")`;
    pose.style.backgroundPosition = `${walking ? Math.floor((t - 2200) / 200) % 3 * 50 : frame * 25}% 0%`;
    const closed = pattern.blinks > 0 && t >= 650 && t < 950
      || pattern.blinks === 2 && t >= 1250 && t < 1550;
    sprite.querySelector('.blink').style.opacity = !walking && frame === 0 && closed ? '1' : '0';
  }

  function showClue() {
    phase = 'clue';
    started = performance.now();
    teacher.hidden = false;
    choices.hidden = true;
    replay.hidden = true;
    document.querySelector('#start').textContent = dismissed.size ? '다시 찾아볼래' : '기억했어 · 찾기 시작';
    status.textContent = '진짜의 행동을 먼저 살펴봐.';
  }

  function newRound() {
    won = false;
    dismissed = new Set();
    const sequence = difficulty.value === 'sequence';
    round = [
      { real: true, action: 'sit', blinks: sequence ? 2 : 0 },
      { real: false, action: sequence ? 'sit' : 'walk', blinks: sequence ? 1 : 0 },
      { real: false, action: sequence ? 'walk' : 'stand', blinks: sequence ? 2 : 0 },
    ];
    for (let i = round.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [round[i], round[j]] = [round[j], round[i]];
    }
    document.querySelector('#clue-text').textContent = sequence ? '눈을 두 번 깜빡이고 → 앉았다 일어나기' : '천천히 앉았다가 → 다시 일어나기';
    choices.replaceChildren();
    round.forEach((pattern, index) => {
      const button = document.createElement('button');
      button.className = 'candidate';
      button.setAttribute('aria-label', `${index + 1}번 드래곤 선택`);
      button.innerHTML = '<div class="sprite"><span class="pose"></span><img class="blink" alt=""></div><span class="number"></span>';
      button.querySelector('.number').textContent = `${index + 1}번`;
      prepareSprite(button);
      button.onclick = () => {
        if (phase !== 'observe' || won || dismissed.has(index)) return;
        if (pattern.real) {
          won = true;
          button.classList.add('correct');
          button.querySelector('.number').textContent = '진짜를 찾았어!';
          status.textContent = '역시 넌 나를 알아보는구나!';
          replay.hidden = true;
          choices.querySelectorAll('button').forEach(candidate => candidate.disabled = true);
          document.querySelector('#again').focus();
        } else {
          dismissed.add(index);
          button.classList.add('dismissed');
          button.disabled = true;
          button.querySelector('.number').textContent = '분신이었네!';
          status.textContent = '헤헤, 나는 분신이야! 약속한 행동을 다시 살펴봐.';
        }
      };
      choices.append(button);
    });
    showClue();
  }

  document.querySelector('#start').onclick = () => {
    phase = 'observe';
    teacher.hidden = true;
    choices.hidden = false;
    replay.hidden = false;
    started = performance.now();
    status.textContent = '약속한 행동을 하는 드래곤을 골라 줘.';
    choices.querySelector('button:not(:disabled)').focus();
  };
  replay.onclick = () => { showClue(); document.querySelector('#start').focus(); };
  document.querySelector('#again').onclick = newRound;
  difficulty.onchange = newRound;
  prepareSprite(teacher);
  newRound();
  function animate(now) {
    const elapsed = now - started;
    if (phase === 'clue') paint(teacher.querySelector('.sprite'), round.find(pattern => pattern.real), elapsed);
    else choices.querySelectorAll('.sprite').forEach((sprite, index) => paint(sprite, round[index], elapsed));
    requestAnimationFrame(animate);
  }
  requestAnimationFrame(animate);
</script>
</html>
