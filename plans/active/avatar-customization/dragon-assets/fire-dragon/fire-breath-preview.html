<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>불 드래곤 불 뿜기 시험</title><style>
body{margin:0;background:#202126;color:#fff;font-family:sans-serif;text-align:center}main{max-width:1300px;margin:auto;padding:20px}h1{font-size:1.3rem}button{font:inherit;padding:.6rem 1rem;cursor:pointer}.scene{position:relative;text-align:left;overflow:hidden;background:#e9e7e7;line-height:0}.dragon{display:block;width:70%;height:auto}.flame{position:absolute;left:54%;top:33%;width:44%;height:auto;transform:translateY(-50%) scale(0,1);transform-origin:0% 50%;opacity:0;pointer-events:none}.flame.active{opacity:1;transform:translateY(-50%) scale(1,1);transition:transform .25s ease-out,opacity .1s}
</style></head><body><main><h1>성체 불 드래곤 · 불 뿜기 시험</h1><p>버튼을 누르면 불을 모으고 발사합니다. 불길은 별도 이미지입니다.</p><button id="fire" type="button">불 뿜기</button><div class="scene"><img class="dragon" id="dragon" src="concepts/adult.png" alt="성체 불 드래곤"><img class="flame" id="flame" src="effects/fire-stream-transparent.png" alt=""></div></main><script>
const dragon=document.querySelector('#dragon');const flame=document.querySelector('#flame');const button=document.querySelector('#fire');const ready='motions/fire-breath/charge.png';const preload=new Image();preload.src=ready;button.addEventListener('click',()=>{button.disabled=true;dragon.src=ready;setTimeout(()=>flame.classList.add('active'),450);setTimeout(()=>flame.classList.remove('active'),1950);setTimeout(()=>{dragon.src='concepts/adult.png';button.disabled=false},2250)});
</script></body></html>
