<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>불 드래곤 대기 동작 시험</title>
<style>
body{margin:0;background:#202126;color:#f5f5f5;font-family:sans-serif;text-align:center}main{max-width:1100px;margin:auto;padding:20px}h1{font-size:1.3rem}.scene{position:relative;line-height:0}.scene img{width:100%;height:auto}.layer{position:absolute;inset:0;opacity:0}.breath{animation:breathe 4s ease-in-out infinite}.blink{clip-path:inset(24% 20% 71% 75%);animation:blink 6s infinite}button{font:inherit;padding:.6rem 1rem;cursor:pointer} .paused .layer{animation-play-state:paused}@keyframes breathe{0%,100%{opacity:0}50%{opacity:1}}@keyframes blink{0%,92%,98%,100%{opacity:0}94%,96%{opacity:1}}@media(prefers-reduced-motion:reduce){.layer{animation:none}}
</style></head><body><main><h1>성체 불 드래곤 · 대기 동작 시험</h1><p>원본과 호흡 시안을 서서히 겹쳐 보여 주고 눈 깜빡임을 반복합니다.</p><button id="toggle" type="button">일시 정지</button><div class="scene" id="scene"><img src="concepts/adult.png" alt="성체 불 드래곤"><img class="layer breath" src="motions/idle/breathe-in.png" alt=""><img class="layer blink" src="motions/idle/blink-closed.png" alt=""></div></main><script>const scene=document.querySelector('#scene');const button=document.querySelector('#toggle');button.addEventListener('click',()=>{const paused=scene.classList.toggle('paused');button.textContent=paused?'재생':'일시 정지'});</script></body></html>
